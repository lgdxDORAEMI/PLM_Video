<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F4FAF0" />
  <title>ThinQ Pregnancy </title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4faf0;color:#173a2a;font-family:Arial,"Noto Sans KR",sans-serif}
    main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .wrap{width:min(960px,100%)}
    .eyebrow{font-size:14px;letter-spacing:.08em;font-weight:700;color:#5c796b;margin-bottom:10px}
    h1{font-size:clamp(28px,5vw,48px);line-height:1.15;margin:0 0 12px}
    p{margin:0 0 22px;color:#5c6d64;font-size:16px;line-height:1.6}
    .video{background:#000;border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(23,58,42,.12)}
    video{display:block;width:100%;height:auto;background:#000}
    .note{text-align:center;margin-top:16px;font-size:13px;color:#718078}
  </style>
</head>
<body>
<main>
  <section class="wrap">
    <div class="eyebrow">1 MINUTE DEMO</div>
    <h1>하루의 작은 선택까지,<br>혼자 고민하지 않도록</h1>
    <p>ThinQ Pregnancy의 핵심 기능을 짧게 확인해보세요.</p>
    <div class="video">
      <video controls playsinline preload="metadata" poster="poster.jpg">
        <source src="demo.mp4" type="video/mp4" />
        브라우저에서 영상을 재생할 수 없습니다.
      </video>
    </div>
    <div class="note">실제 서비스 시연은 현장에서 확인해 주세요.</div>
  </section>
</main>
</body>
</html>
